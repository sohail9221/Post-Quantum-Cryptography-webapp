<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post-Quantum Cryptography Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            margin-top: 50px;
        }
        .key-display {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Post-Quantum Cryptography Demo</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <h2>Key Generation</h2>
            </div>
            <div class="card-body">
                <button id="generate-btn" class="btn btn-primary">Generate Keys</button>
                <div class="mt-3">
                    <h5>Public Key:</h5>
                    <div id="public-key" class="key-display"></div>
                    <h5>Private Key:</h5>
                    <div id="private-key" class="key-display"></div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <h2>Encryption</h2>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="message" class="form-label">Message to Encrypt:</label>
                    <input type="text" id="message" class="form-control">
                </div>
                <button id="encrypt-btn" class="btn btn-primary">Encrypt</button>
                <div class="mt-3">
                    <h5>Ciphertext:</h5>
                    <div id="ciphertext" class="key-display"></div>
                    <h5>Shared Secret:</h5>
                    <div id="shared-secret" class="key-display"></div>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">
                <h2>Decryption</h2>
            </div>
            <div class="card-body">
                <button id="decrypt-btn" class="btn btn-primary">Decrypt</button>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
